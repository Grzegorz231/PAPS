name: Docker CI

on:
  push:
    branches: [ LabWork5 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Images
        run: docker compose build

      - name: Run Containers
        run: docker compose up -d

      - name: Check Status
        run: docker ps